services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mediamtx:
    image: bluenviron/mediamtx:1.9.0
    ports:
      - "${MEDIAMTX_RTMP_PORT:-1935}:1935"  # RTMP publish (DJI)
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"  # RTSP
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"   # HLS
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"  # WebRTC
    volumes:
      - ./services/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  # ── Application services ────────────────────────────────────────────────────

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:$POSTGRES_PORT/$POSTGRES_DB
      NATS_URL: ${NATS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MEDIAMTX_HLS_BASE: http://localhost:8888
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_GENERATE_MODEL: ${OLLAMA_GENERATE_MODEL}
    depends_on:
      - postgres
      - nats
      - minio
      - mediamtx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT}:8080"
    volumes:
      - ./configs:/app/configs:ro

  worker:
    build: ./services/worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:$POSTGRES_PORT/$POSTGRES_DB
      NATS_URL: ${NATS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_GENERATE_MODEL: ${OLLAMA_GENERATE_MODEL}
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs:/app/configs:ro

  ui:
    build: ./services/ui
    environment:
      VITE_API_BASE: http://localhost:${API_PORT}
      VITE_HLS_BASE: http://localhost:8888
      VITE_RTMP_BASE: rtmp://localhost:1935
    depends_on:
      - api
    ports:
      - "${UI_PORT}:5173"

volumes:
  pgdata:
  miniodata:
