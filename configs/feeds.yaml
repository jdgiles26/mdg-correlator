# Default 25 camera feeds for the multigrid.
# These map to streams generated locally by MediaMTX using ffmpeg lavfi sources.
# MediaMTX starts ffmpeg for each path via runOnInit — no external network required.
# HLS is served at http://localhost:8888/{name}/index.m3u8
feeds:
  - name: cam_01
    rtsp_url: rtsp://mediamtx:8554/cam_01
    enabled: true
